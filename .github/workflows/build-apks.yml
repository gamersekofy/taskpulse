name: Build Phone & Wear APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare debug keystore and .env
        run: |
          base64 --decode debug.keystore.base64 > debug.keystore
          if [ ! -f .env ]; then touch .env; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Phone and Wear Debug APKs
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: taskpulse-phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: taskpulse-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
